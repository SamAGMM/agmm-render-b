name: AGMM critique audio
run-name: AGMM critique audio ${{ inputs.label }}
# Audio forensics for the Hail Mary V4 critique (2 Nov 2026): htdemucs vocal / non-vocal split, K-weighted 100 ms levels, onsets + CLAP labels,
# faster-whisper word timings on the vocal stem, pyin pitch, music tempo/key/centroid. Audio-only stream copies come from the PRIVATE repo
# by read-only deploy key. Nothing decodes on the Mac. Pool B only.
on:
  workflow_dispatch:
    inputs:
      private_commit: { description: 40-hex commit of agmm-video-render holding hailmary/critique-v4/audio, required: true }
      files: { description: 'space separated file names inside hailmary/critique-v4/audio (empty = all)', required: false, default: '' }
      label: { description: short safe label, required: true }
permissions:
  contents: read
concurrency:
  group: agmm-critique-audio-${{ inputs.label }}
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'SamAGMM/agmm-render-b'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          python3 - <<'PY'
          import json, os
          allf = "ours_H02.m4a ours_H03.m4a ours_H04.m4a ours_H05.m4a ours_H06.m4a ours_H07.m4a ours_H08.m4a ours_H09.m4a ours_H10.m4a ours_H11.m4a ref1_o2.mp3 ref1_o3.mp3 ref1_o4.mp3 ref1_o5.mp3 ref1_o6.mp3 ref1_o7.mp3 ref1_o8.mp3 ref2_r1.m4a ref2_r2.m4a ref2_r3.m4a ref2_r4.m4a ref2_r5.m4a ref3_n1.mp3 ref3_n2.mp3 ref3_n3.mp3 ref3_n4.mp3".split()
          want = "${{ inputs.files }}".split() or allf
          m = {"file": [f for f in want]}
          open(os.environ["GITHUB_OUTPUT"], "a").write("matrix=" + json.dumps(m) + "\n")
          PY
  analyse:
    needs: plan
    if: github.repository == 'SamAGMM/agmm-render-b'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: agmmltd-arch/agmm-video-render
          ref: ${{ inputs.private_commit }}
          ssh-key: ${{ secrets.AGMM_SFX_READ_DEPLOY_KEY }}
          path: private
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            hailmary/critique-v4/audio/${{ matrix.file }}
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: pub
          sparse-checkout: |
            .github/scripts
      - name: Runtime (static ffmpeg, no apt)
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"
      - name: Python deps (CPU torch)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --retries 4 "numpy<2" scipy soundfile
          python3 -m pip install --quiet --retries 4 torch==2.2.2 torchaudio==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --quiet --retries 4 demucs==4.0.1 librosa faster-whisper "transformers<4.50"
      - name: Separate (htdemucs, vocals vs rest)
        run: |
          set -euo pipefail
          mkdir -p work out
          F="private/hailmary/critique-v4/audio/${{ matrix.file }}"; ls -la "$F"
          ffmpeg -v error -y -i "$F" -vn -ac 2 -ar 44100 work/full.wav
          python3 -m demucs -n htdemucs --two-stems vocals --float32 -d cpu -o work/sep work/full.wav
          ls -la work/sep/htdemucs/full
      - name: Analyse
        run: |
          set -euo pipefail
          N="${{ matrix.file }}"; N="${N%.*}"
          python3 pub/.github/scripts/critique_audio.py "$N" work/full.wav work/sep/htdemucs/full/vocals.wav work/sep/htdemucs/full/no_vocals.wav "out/$N.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crit-${{ matrix.file }}
          path: out/
          retention-days: 7
