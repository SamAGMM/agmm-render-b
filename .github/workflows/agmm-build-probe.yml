name: AGMM build probe
run-name: AGMM build probe ${{ inputs.label }}
# Hail Mary shorts, fast path (26 Oct 2026): build once, render the picture in up to 20 parallel segments at device scale 2 (2160x3840 from pages authored at 1080x1920 CSS px), split by measured cost per frame (the clone crowd is the slow part) (OpenFilm, headless Chromium),
# join them, mix the sound with the project's own mix.py (designed arc: build-up, riser, hit, ducking), master to -14 LUFS, run qa.py.
# The project and its sounds come from the PRIVATE repo via the read-only deploy key. Nothing renders on the Mac; no media is committed here.
on:
  workflow_dispatch:
    inputs:
      private_commit: { description: 40-hex commit of agmm-video-render holding the film folder, required: true }
      project_path: { description: film folder inside that commit, required: true }
      voice_run_id: { description: voicefree-chatterbox run id with the takes, required: true }
      voice_label: { description: label of that run, required: true }
      label: { description: short label, required: true }
      voice_repo: { description: 'repo that holds the voicefree-chatterbox run(s) (owner/name); empty = this repo. The pack is AES-encrypted with that repo VOICEFREE_PASS, so this repo VOICEFREE_PASS must match', required: false, default: '' }
      pick: { description: forced takes e.g. P1=2,P4=1, required: false, default: '' }
      voice2_run_id: { description: optional second voicefree run whose takes replace the same paragraphs, required: false, default: '' }
      voice2_label: { description: label of that run, required: false, default: '' }
      extra_voices: { description: 'more voicefree runs, later ones win per paragraph, space-separated run_id:label', required: false, default: '' }
      segments: { description: number of parallel picture segments (max 20), required: false, default: '20' }
      runner: { description: 'runs-on label for the picture segment jobs. ubuntu-24.04 starves when GitHub is short of runners; ubuntu-22.04 is the same x64 hardware and Chromium and was picked up in about 70 s', required: false, default: ubuntu-22.04 }
      runner_misc: { description: 'runs-on label for the build and assemble jobs', required: false, default: ubuntu-22.04 }
      workers: { description: 'browsers per segment job (4 vCPU). 2 is the fastest measured: 1.4 to 1.8x over openfilm default (1 for short segments, 3 for long ones); frames identical for any count', required: false, default: '2' }
      scale: { description: 'device scale factor passed to openfilm render --scale: 2 = 2160x3840 (pages stay 1080x1920 CSS px), 1 = 1080x1920', required: false, default: '2' }
      reuse_picture_run: { description: 'run id whose picture segments to reuse (timeline AND scale must be identical)', required: false, default: '' }
      cuts: { description: 'optional explicit segment cut frames, comma-separated, first 0 and last = total frames (keeps reused segments aligned when the film length changes)', required: false, default: '' }
      rerender_until: { description: 'with reuse_picture_run: ALSO re-render segments that start before this second (e.g. a fixed opening), reuse the middle', required: false, default: '' }
      rerender_from: { description: 'with reuse_picture_run: re-render segments ending after this second, reuse the rest (empty = reuse all)', required: false, default: '' }
permissions:
  contents: read
  actions: read
concurrency:
  group: agmm-hailmary-par2-${{ inputs.label }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'agmmltd-arch/agmm-render-public' || github.repository == 'SamAGMM/agmm-render-b'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    outputs:
      total: ${{ steps.b.outputs.total }}
      world_at: ${{ steps.b.outputs.world_at }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: agmmltd-arch/agmm-video-render
          ref: ${{ inputs.private_commit }}
          ssh-key: ${{ secrets.AGMM_SFX_READ_DEPLOY_KEY }}
          path: private
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            ${{ inputs.project_path }}
      - name: Runtime (static ffmpeg, no apt)
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"
      - name: Voice pack (decrypt)
        env:
          GH_TOKEN: ${{ github.token }}
          VOICEFREE_PASS: ${{ secrets.VOICEFREE_PASS }}
        run: |
          set -euo pipefail
          gh run download "${{ inputs.voice_run_id }}" -R "${{ inputs.voice_repo || github.repository }}" -n "voicefree-chatterbox-${{ inputs.voice_label }}-ENC" -D "$RUNNER_TEMP/vpack"
          mkdir -p "$RUNNER_TEMP/voice"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:VOICEFREE_PASS -in "$RUNNER_TEMP/vpack/synth-pack.enc" | tar -x -C "$RUNNER_TEMP/voice"
          n=3
          for rl in ${{ inputs.extra_voices }}; do
            rid=${rl%%:*}; lab=${rl#*:}
            gh run download "$rid" -R "${{ inputs.voice_repo || github.repository }}" -n "voicefree-chatterbox-$lab-ENC" -D "$RUNNER_TEMP/vpack$n"
            mkdir -p "$RUNNER_TEMP/voice$n"
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:VOICEFREE_PASS -in "$RUNNER_TEMP/vpack$n/synth-pack.enc" | tar -x -C "$RUNNER_TEMP/voice$n"
            n=$((n+1))
          done
          if [ -n "${{ inputs.voice2_run_id }}" ]; then
            gh run download "${{ inputs.voice2_run_id }}" -R "${{ inputs.voice_repo || github.repository }}" -n "voicefree-chatterbox-${{ inputs.voice2_label }}-ENC" -D "$RUNNER_TEMP/vpack2"
            mkdir -p "$RUNNER_TEMP/voice2"
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:VOICEFREE_PASS -in "$RUNNER_TEMP/vpack2/synth-pack.enc" | tar -x -C "$RUNNER_TEMP/voice2"
          fi
      - id: b
        name: Build the edit and the mix plan on the voice
        run: |
          set -euo pipefail
          cp -r "private/${{ inputs.project_path }}" film
          cd film
          V2=""; for d in $(ls -d "$RUNNER_TEMP"/voice[0-9]* 2>/dev/null | sort -V); do V2="$V2 $d"; done; [ -n "$V2" ] && V2="--voice2$V2"
          python3 build_film.py --voice "$RUNNER_TEMP/voice" $V2 --pick "${{ inputs.pick }}"
          echo "total=$(python3 -c "import json;print(json.load(open('assets/timeline.json'))['total'])")" >> "$GITHUB_OUTPUT"
          echo "world_at=$(python3 -c "import json;print(json.load(open('assets/timeline.json'))['world_at'])")" >> "$GITHUB_OUTPUT"
      - name: Fingerprint of what the build made
        run: |
          cd film
          python3 --version; python3 -c "import numpy; print('numpy', numpy.__version__)" || true
          for f in assets/timeline.json mix.json film.html BUILD.json; do [ -f $f ] && sha256sum $f; done | tee ../fingerprint.txt
          find assets -type f | sort | xargs sha256sum | sha256sum | tee -a ../fingerprint.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: film-${{ inputs.label }}
          path: film
          retention-days: 1
          include-hidden-files: true
