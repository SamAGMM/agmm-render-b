name: AGMM h34 hiband
run-name: AGMM h34 hiband ${{ inputs.label }}
# high-band scan (energy above 4 kHz per 100 ms) of a par5 run's mix, sfx stem, music stem and voice stem. Numbers only.
on:
  workflow_dispatch:
    inputs:
      run_id: { description: par5 run id, required: true }
      artifact: { description: artifact name, required: true }
      label: { description: label, required: true }
permissions:
  contents: read
  actions: read
jobs:
  scan:
    if: github.repository == 'SamAGMM/agmm-render-b'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: fetch the mix and stems only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ inputs.run_id }}" -R "${{ github.repository }}" -n "${{ inputs.artifact }}" -p "gate-input/mix.wav" -p "gate-input/stems/*" -D d
          find d -type f -name '*.wav'
      - name: scan
        run: |
          python3 -m pip install --quiet numpy scipy
          python3 - <<'PY'
          import glob, numpy as np
          from scipy.io import wavfile
          from scipy.signal import butter, sosfilt
          def load(p):
              sr, x = wavfile.read(p); x = x.astype(np.float64)
              if x.ndim > 1: x = x.mean(1)
              if x.dtype != np.float64 or abs(x).max() > 2: x = x / 32768.0
              return sr, x
          sos = None
          out = []
          for p in sorted(glob.glob("d/**/*.wav", recursive=True)):
              sr, x = load(p)
              sos = butter(6, 4000, "high", fs=sr, output="sos"); h = sosfilt(sos, x)
              n = int(sr * 0.1); nb = len(x) // n
              full = np.array([np.sqrt(np.mean(x[i*n:(i+1)*n]**2) + 1e-12) for i in range(nb)])
              hi = np.array([np.sqrt(np.mean(h[i*n:(i+1)*n]**2) + 1e-12) for i in range(nb)])
              fd = 20*np.log10(full); hd = 20*np.log10(hi)
              print("FILE", p, "sr", sr, "dur", round(len(x)/sr, 2), "median full dB", round(float(np.median(fd)), 1), "median hi dB", round(float(np.median(hd)), 1))
              order = np.argsort(-hd)[:12]
              for i in sorted(order): print("  t=%.1f hi=%.1f dB full=%.1f dB hi-full=%.1f" % (i*0.1, hd[i], fd[i], hd[i]-fd[i]))
              # spikes: hi band 10 dB or more above the local median of +-1 s
              spikes = []
              for i in range(nb):
                  lo, up = max(0, i-10), min(nb, i+11); med = np.median(hd[lo:up])
                  if hd[i] - med > 10 and hd[i] > -45: spikes.append((round(i*0.1, 1), round(float(hd[i]), 1), round(float(hd[i]-med), 1)))
              print("  SPIKES (t, hi dB, over local median):", spikes[:40])
          PY
