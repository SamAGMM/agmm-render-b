name: AGMM soundbible
run-name: AGMM soundbible ${{ inputs.label }}
# Sound bible v5 (2 Nov 2026), pool B: demucs stems, per-100ms loudness of voice vs the rest, onset events, CLAP zero-shot labels.
# Videos and analyze.py come from the PRIVATE repo via the read-only deploy key. Nothing is decoded on the Mac; only JSON and PNG come out.
on:
  workflow_dispatch:
    inputs:
      private_commit: { description: 40-hex commit of agmm-video-render holding hailmary/soundref and hailmary/soundref-ours, required: true }
      label: { description: short label, required: true }
permissions:
  contents: read
concurrency:
  group: agmm-soundbible-${{ inputs.label }}
  cancel-in-progress: false
jobs:
  analyse:
    if: github.repository == 'SamAGMM/agmm-render-b'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        v: [r1, r2, r3, r4, r5, r6, r7, r8, p1, p2, p3, p4, p5, n1, n2, n3, n4]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: agmmltd-arch/agmm-video-render
          ref: ${{ inputs.private_commit }}
          ssh-key: ${{ secrets.AGMM_SFX_READ_DEPLOY_KEY }}
          path: private
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            hailmary/soundref
            hailmary/soundref-v5
      - name: Runtime (static ffmpeg, no apt)
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"
      - name: Python deps (CPU torch, demucs, transformers)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          pip install --quiet --retries 4 "numpy<2" scipy soundfile matplotlib
          pip install --quiet --retries 4 torch==2.2.2 torchaudio==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet --retries 4 demucs==4.0.1 "transformers==4.46.3" "numpy<2"
          pip install --quiet --retries 4 "librosa==0.10.2.post1" faster-whisper pyloudnorm "numpy<2"
          python -c "import torch,demucs,transformers;print(torch.__version__,transformers.__version__)"
      - name: Analyse
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/venv/bin/activate"
          V="${{ matrix.v }}"
          F="private/hailmary/soundref/$V.mp4"; [ -f "$F" ] || F="private/hailmary/soundref-v5/$V.mp4"
          ls -la "$F"
          python private/hailmary/soundref-v5/analyze2.py "$F" "$V" out 2>&1 | grep -v Warning | tail -60
          ls -la out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: soundbible-${{ inputs.label }}-${{ matrix.v }}
          path: out
          retention-days: 7
