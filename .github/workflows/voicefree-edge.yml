name: voicefree edge
run-name: voicefree edge ${{ inputs.label }}
# 2 Nov 2026: Microsoft Edge neural TTS (edge-tts, free, no key) in place of Chatterbox. Same request transport and same encrypted pack as voicefree-delivery.yml, so the
# film side (agmm-hailmary-par3/par5: voice_run_id, voice_label, voice_repo) is unchanged. Script text is read from the PRIVATE repo with the read-only deploy key and never
# enters this public repo or its logs; the public artifact holds numbers only. Pack = AES-256 (repo secret VOICEFREE_PASS), artifact voicefree-chatterbox-<label>-ENC.
on:
  workflow_dispatch:
    inputs:
      private_commit:
        description: 40-hex commit of agmm-video-render holding the request
        required: true
      request_path:
        description: path of the request JSON inside that commit (voice-free/req/...)
        required: true
      label:
        description: short label
        required: true
permissions:
  contents: read
concurrency:
  group: voicefree-edge-${{ inputs.label }}
  cancel-in-progress: false
jobs:
  synth:
    if: github.repository == 'SamAGMM/agmm-render-b'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts/voicefree
      - name: Fetch request (read-only deploy key)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: agmmltd-arch/agmm-video-render
          ref: ${{ inputs.private_commit }}
          ssh-key: ${{ secrets.AGMM_SFX_READ_DEPLOY_KEY }}
          path: private
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            voice-free/req
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Cache Whisper weights, pip wheels
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: voicefree-edge-${{ runner.os }}-v1
      - name: Install runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install edge-tts faster-whisper==1.2.1 soundfile pyloudnorm num2words numpy
          python -m pip freeze | grep -i -E "^(edge-tts|faster|ctranslate2|numpy|pyloudnorm)" | tr '\n' ' '
      - name: Can the runner reach Microsoft's TTS service
        run: |
          python - <<'PY'
          import asyncio, edge_tts
          async def go():
              n = 0
              async for ch in edge_tts.Communicate("Reach test.", "en-GB-RyanNeural").stream():
                  if ch["type"] == "audio": n += len(ch["data"])
              return n
          print("edge-tts reachable, audio bytes", asyncio.run(go()))
          PY
      - name: Synthesize (edge-tts) and run the strict pronunciation gate
        run: |
          python .github/scripts/voicefree/synth_edge.py --request "private/${{ inputs.request_path }}" --out "$RUNNER_TEMP/synth-out" --pub "$RUNNER_TEMP/pub-out"
      - name: Upload numbers-only gate measurements (no script text)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: edgegate-${{ inputs.label }}
          path: ${{ runner.temp }}/pub-out
          retention-days: 7
      - name: Encrypted debug report (texts of every take, for the operator only)
        if: always()
        env:
          EDGE_REPORT_PASS: ${{ secrets.EDGE_REPORT_PASS }}
        run: |
          set -euo pipefail
          test -n "$EDGE_REPORT_PASS" || exit 0
          python - <<'PY'
          import glob, json, os
          o = os.environ["RUNNER_TEMP"]
          rows = []
          for f in sorted(glob.glob(o + "/synth-out/*.receipt.json")):
              r = json.load(open(f)); g = r["gate"]
              rows.append({"take": os.path.basename(f).replace(".receipt.json", ""), "voice": r["voice"], "rate": r["rate"], "pass": g["pass"], "text": r["text"], "spoken": r["spoken_text"],
                           "heard_large": r["asr_text"], "heard_medium": r["asr_variants"]["medium.en"], "min_prob": g["lowest_prob"], "min_word": g["lowest_word"],
                           "diffs_large": g["large_v3"]["diffs"], "diffs_medium": g["medium_en"]["diffs"], "word_probs": g["word_probs"], "timing": r["timing"]})
          json.dump(rows, open(o + "/edge-report.json", "w"), indent=1)
          PY
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:EDGE_REPORT_PASS -in "$RUNNER_TEMP/edge-report.json" -out "$RUNNER_TEMP/edge-report.enc"
      - name: Upload encrypted debug report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: edgereport-${{ inputs.label }}-ENC
          path: ${{ runner.temp }}/edge-report.enc
          retention-days: 7
          if-no-files-found: ignore
      - name: Encrypt pack (public repo)
        env:
          VOICEFREE_PASS: ${{ secrets.VOICEFREE_PASS }}
        run: |
          set -euo pipefail
          test -n "$VOICEFREE_PASS"
          tar -C "$RUNNER_TEMP/synth-out" -cf - . | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:VOICEFREE_PASS -out "$RUNNER_TEMP/synth-pack.enc"
          ls -l "$RUNNER_TEMP/synth-pack.enc" | awk '{print "encrypted bytes", $5}'
      - name: Upload encrypted pack
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: voicefree-chatterbox-${{ inputs.label }}-ENC
          path: ${{ runner.temp }}/synth-pack.enc
          retention-days: 7
          if-no-files-found: error
