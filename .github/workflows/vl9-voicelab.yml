name: vl9 voice lab
run-name: vl9 voice lab ${{ inputs.label }}
# 3 Nov 2026: voice lab for the Hail Mary story voice. Same synthesis and strict gate as voicefree-edge.yml (synth_edge.py), then prosody
# measurements (Praat F0, energy, pauses, jitter) and an SSML style probe. Public artifact vl9lab-<label> holds numbers only; no audio is uploaded.
on:
  workflow_dispatch:
    inputs:
      private_commit:
        description: 40-hex commit of agmm-video-render holding the request
        required: true
      request_path:
        description: path of the request JSON inside that commit (voice-free/req/...)
        required: true
      label:
        description: short label (vl9-...)
        required: true
      style_probe:
        description: run the SSML style probe (yes/no)
        required: false
        default: 'no'
permissions:
  contents: read
concurrency:
  group: vl9-${{ inputs.label }}
  cancel-in-progress: false
jobs:
  lab:
    if: github.repository == 'SamAGMM/agmm-render-b'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts/voicefree
            .github/scripts/vl9
      - name: Fetch request (read-only deploy key)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: agmmltd-arch/agmm-video-render
          ref: ${{ inputs.private_commit }}
          ssh-key: ${{ secrets.AGMM_SFX_READ_DEPLOY_KEY }}
          path: private
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            voice-free/req
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Cache Whisper weights, pip wheels
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: voicefree-edge-${{ runner.os }}-v1
      - name: Install runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install edge-tts faster-whisper==1.2.1 soundfile pyloudnorm num2words numpy praat-parselmouth
      - name: Style probe (does mstts express-as survive)
        if: inputs.style_probe == 'yes'
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/lab"
          python .github/scripts/vl9/vl9_style_probe.py "$RUNNER_TEMP/lab/style.json"
      - name: Synthesize and run the strict gate
        run: |
          python .github/scripts/voicefree/synth_edge.py --request "private/${{ inputs.request_path }}" --out "$RUNNER_TEMP/synth-out" --pub "$RUNNER_TEMP/pub-out"
      - name: Prosody measurements
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/lab"
          python .github/scripts/vl9/vl9_analyse.py --synth "$RUNNER_TEMP/synth-out" --out "$RUNNER_TEMP/lab/analysis.json"
      - name: Upload numbers-only results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vl9lab-${{ inputs.label }}
          path: ${{ runner.temp }}/lab
          retention-days: 7
